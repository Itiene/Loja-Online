<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../estilos/cadastro.css">
    <title>Entrar</title>
</head>
<body>
    <main>
        <section>
            <div id="menu-login">
                <a href="#entrar" class="entrar"><p>Entrar</p></a>
                <a href="#cadastro" class="cadastro"><p>Cadastro</p></a>
            </div>

            <div id="container">
                <div id="cadastro">
                    <h1>Criar Conta</h1>
                    <form action="">
                        <label>Nome:</label>
                        <input type="text" id="nome" class="cadastro" placeholder="Insira seu nome" required>
                        <label>Email:</label>
                        <input type="email" id="email" class="cadastro" placeholder="exemplo@gmail.com" required>
                        <label>Palavra-passe:</label>
                        <input type="password" id="password" class="cadastro" maxlength="10" required>
                        <label>Confirmar Palavra-passe:</label>
                        <input type="password" id="password" class="cadastro" required>
                        <p>
                            <input type="checkbox" id="checkbox">Aceito os termos e condições
                        </p>
                        <button id="btn_criar">Criar conta</button>
                        <p>Já tem uma conta?<a href="entrar.html">Entrar</a></p>
                    </form>
                </div> 
                <div id="entrar">
                    <h1>Login</h1>
                    <form action="">
                        <label>Nome de usuário:</label>
                        <input type="text" id="user" placeholder="ex:itieneguilherme" required>
                        <label>Palavra-passe:</label>
                        <input type="password" id="password" minlength="8" maxlength="10" required placeholder="**********">
                        <div id="verificacao">
                            <p><input type="checkbox" id="checkbox">Remember me</p>
                            <p><a href="#">Esqueceu a Senha?</a></p>
                        </div>
                        <button id="btn_entrar">Entrar</button>
                        <p>Não tem uma conta?<a href="cadastro.html">Cadastrar-se</a></p>
                    </form>
                </div>
            </div>
        </section>
    </main>
    
</body>
</html>
