<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .slider {
            width: 600px;
            margin: 50px auto;
            position: relative;
        }

        .slides {
            position: relative;
            overflow: hidden;
        }

        .slide {
            width: 100%;
            display: none;
            border-radius: 10px;
        }

        .slide.active {
            display: block;
        }

        button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 20px;
            border-radius: 5px;
        }

        #prev {
            left: 10px;
        }

        #next {
            right: 10px;
        }
    </style>
</head>
<body>
    <div class="slider">
        <button id="prev">&#10094;</button>

        <div class="slides">
            <img src="https://picsum.photos/id/1015/600/300" class="slide active">
            <img src="https://picsum.photos/id/1016/600/300" class="slide">
            <img src="https://picsum.photos/id/1018/600/300" class="slide">
        </div>

        <button id="next">&#10095;</button>
    </div>

    <script>
        const slides = document.querySelectorAll(".slide");
        const nextBtn = document.getElementById("next");
        const prevBtn = document.getElementById("prev");

        let currentSlide = 0;

        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove("active"));
            slides[index].classList.add("active");
        }

        nextBtn.addEventListener("click", () => {
            currentSlide++;

            if (currentSlide >= slides.length) {
                currentSlide = 0;
            }

            showSlide(currentSlide);
        });

        prevBtn.addEventListener("click", () => {
            currentSlide--;

            if (currentSlide < 0) {
                currentSlide = slides.length - 1;
            }

            showSlide(currentSlide);
        });
        setInterval(() => {
            currentSlide++;

            if (currentSlide >= slides.length) {
                currentSlide = 0;
            }

            showSlide(currentSlide);
        }, 3000);
    </script>
</body>
</html>
