<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <h1>Criar Conta</h1>
    <form action="">
        <label>Nome:</label>
        <input type="text" id="nome" placeholder="Insira seu nome" required>
        <label>Email:</label>
        <input type="email" id="email" placeholder="exemplo@gmail.com" required>
        <label for="">Nome de usuário:</label>
        <input type="text" id="user" placeholder="ex:itieneguilherme" required>
        <label>Palavra-passe:</label>
        <input type="password" id="password" maxlength="10" required>
        <label>Confirmar Palavra-passe:</label>
        <input type="password" id="password" required>

        <p><input type="checkbox" id="checkbox" checked>Aceito os termos e condições</p>
        <p>Já tem uma conta?:<a href="entrar.html" target="_blank">Sign</a></p>
        <button id="btn_criar">Criar conta</button>
    </form>
</body>
</html>
